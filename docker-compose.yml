services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8088:8080"

# One-time realm setup (admin console at http://localhost:8088, admin/admin). Verified
# end-to-end against a real Keycloak 26.6 instance - every step below was exercised, not just
# read from docs.
#
#  1. Realm "trieu_universal" (matches KEYCLOAK_ISSUER_URI's default in every module's
#     application.yml - change both together if you rename it).
#
#  2. Client "gateway" - confidential, service accounts ON. This is the ONLY client with
#     introspection rights; copy its secret into KEYCLOAK_CLIENT_SECRET for the gateway.
#     Client Advanced tab / Capability config:
#       - "Allow token introspection without audience check": ON, always. Without it Keycloak
#         refuses to introspect ANY token that doesn't already carry "gateway" itself in its
#         own aud, which in practice is every real end-user token. Applies to all 3
#         internal-token strategies below, not just EXCHANGE.
#       - "Always use lightweight access token": recommended ON (see CLAUDE.md "audience"
#         discussion) - strips default claims from tokens minted for this client so a stolen
#         one carries less. Affects step 4 below (lightweight tokens need an extra mapper flag).
#       - "Support JWT claim in Introspection Response": ON, only if using
#         phantom-token.internal-token=KEYCLOAK_JWT (forwards the JWT Keycloak embeds in the
#         introspection response's "jwt" field - Accept header must be exactly "application/jwt",
#         see IntrospectionClient). Skip and use ORIGINAL if the AS can't hand back a
#         forwardable JWT.
#       - "Standard token exchange": ON, only if using phantom-token.internal-token=EXCHANGE.
#
#  3. Per downstream service, only needed for EXCHANGE: client "resource-service" -
#     confidential, no flows, no service account needed. Exists purely so Keycloak has
#     something to resolve the token-exchange `audience` request parameter against; its
#     clientId must equal the gateway route's `metadata.audience` and that service's
#     `security.expected-audience`.
#
#  4. Per downstream service, only needed for EXCHANGE: client scope "aud-resource-service" -
#       - Protocol mapper, type "Audience": Included Client Audience = resource-service,
#         "Add to access token" ON. If "gateway" has lightweight access tokens ON (step 2),
#         also flag "Add to lightweight access token" - otherwise the mapper silently produces
#         no aud claim at all and the exchange fails with "Requested audience not available".
#       - Assign this scope as a DEFAULT client scope on "gateway" (Client scopes tab). Standard
#         token exchange's `audience` request parameter only *restricts* to audiences already
#         available this way - it does not add new ones ("Audience not found" if the client
#         doesn't exist at all, "Requested audience not available" if it exists but isn't
#         reachable through a default/requested scope).
#
#  5. Client "web-app" - public, standard flow, for getting a user token to test with.
#
#  6. Only needed for phantom-token.internal-token=ORIGINAL: audience mapper on "web-app" adding
#     aud=resource-service, so the token forwarded unchanged still passes the downstream
#     service's audience check. Not needed for KEYCLOAK_JWT or EXCHANGE - both mint their own
#     audience at the gateway instead.
#
#  7. Backchannel logout URL on "web-app": http://host.docker.internal:8080/backchannel-logout
