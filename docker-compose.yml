services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8088:8080"

# One-time realm setup (admin console at http://localhost:8088, admin/admin) - see
# KEYCLOAK_SETUP.md for the full step-by-step and troubleshooting notes.
